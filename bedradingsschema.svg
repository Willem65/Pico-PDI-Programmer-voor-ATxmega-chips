<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <style>
    .box { fill: #f5f5f5; stroke: #333; stroke-width: 2; }
    .pin { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
    .label { font-size: 14px; fill: #111; }
    .pinlabel { font-size: 12px; fill: #333; }
    .wire { stroke: #1a6b1a; stroke-width: 2; fill: none; }
    .wire-data { stroke: #b35900; stroke-width: 2; fill: none; }
    .wire-gnd { stroke: #555; stroke-width: 2; fill: none; }
    .wire-pwr { stroke: #c0392b; stroke-width: 2; fill: none; }
    .note { font-size: 12px; fill: #555; font-style: italic; }
    .title { font-size: 18px; font-weight: bold; fill: #111; }
  </style>

  <text x="20" y="30" class="title">Pico PDI Programmer -- Bedradingsschema</text>

  <!-- Pico board -->
  <rect x="60" y="80" width="180" height="320" rx="10" class="box"/>
  <text x="90" y="105" class="label">Raspberry Pi Pico</text>

  <circle cx="60" cy="140" r="5" class="pin"/>
  <text x="20" y="145" class="pinlabel">GP2 (PDI_CLK)</text>

  <circle cx="60" cy="180" r="5" class="pin"/>
  <text x="20" y="185" class="pinlabel">GP3 (PDI_DATA)</text>

  <circle cx="60" cy="240" r="5" class="pin"/>
  <text x="20" y="245" class="pinlabel">GP0 (debug TX)</text>

  <circle cx="60" cy="280" r="5" class="pin"/>
  <text x="20" y="285" class="pinlabel">GP1 (debug RX)</text>

  <circle cx="60" cy="340" r="5" class="pin"/>
  <text x="20" y="345" class="pinlabel">GND</text>

  <circle cx="240" cy="140" r="5" class="pin"/>
  <text x="245" y="145" class="pinlabel">3V3 OUT</text>

  <!-- XMEGA chip -->
  <rect x="500" y="120" width="160" height="220" rx="8" class="box"/>
  <text x="515" y="145" class="label">ATxmega128A4U</text>

  <circle cx="500" cy="180" r="5" class="pin"/>
  <text x="380" y="185" class="pinlabel">pin 35: RESET/PDI_CLK</text>

  <circle cx="500" cy="220" r="5" class="pin"/>
  <text x="410" y="225" class="pinlabel">pin 34: PDI_DATA</text>

  <circle cx="500" cy="300" r="5" class="pin"/>
  <text x="440" y="305" class="pinlabel">GND</text>

  <circle cx="660" cy="180" r="5" class="pin"/>
  <text x="665" y="185" class="pinlabel">VCC (1.6V - 3.6V)</text>

  <!-- CLK wire: GP2 -> pin35 -->
  <path d="M 60 140 L 30 140 L 30 180 L 500 180" class="wire"/>
  <text x="150" y="172" class="pinlabel" fill="#1a6b1a">PDI_CLK</text>

  <!-- Shared data line node -->
  <circle cx="400" cy="220" r="4" fill="#b35900"/>
  <text x="395" y="245" class="note">gedeelde data-lijn</text>

  <!-- Data wire: shared node -> pin34 -->
  <path d="M 400 220 L 500 220" class="wire-data"/>

  <!-- Diode between GP3 and shared node -->
  <g transform="translate(320,220)">
    <line x1="-30" y1="0" x2="-8" y2="0" class="wire-data"/>
    <polygon points="-8,-10 -8,10 12,0" fill="#333"/>
    <line x1="12" y1="-10" x2="12" y2="10" stroke="#333" stroke-width="2"/>
    <line x1="12" y1="0" x2="80" y2="0" class="wire-data"/>
    <text x="-25" y="-15" class="pinlabel">anode</text>
    <text x="15" y="-15" class="pinlabel">kathode</text>
  </g>
  <path d="M 60 180 L 30 180 L 30 220 L 290 220" class="wire-data"/>
  <text x="120" y="212" class="pinlabel" fill="#b35900">via diode</text>

  <!-- Pull-up resistor from shared node to 3V3 -->
  <g transform="translate(400,220)">
    <line x1="0" y1="0" x2="0" y2="-40" class="wire-pwr"/>
    <rect x="-10" y="-70" width="20" height="30" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="15" y="-50" class="pinlabel">4.7k&#937;</text>
    <line x1="0" y1="-70" x2="0" y2="-100" class="wire-pwr"/>
  </g>
  <path d="M 400 120 L 400 100 L 240 100 L 240 140" class="wire-pwr"/>
  <text x="405" y="105" class="pinlabel" fill="#c0392b">naar 3V3</text>

  <!-- GND wire -->
  <path d="M 60 340 L 30 340 L 30 380 L 500 380 L 500 300" class="wire-gnd"/>
  <text x="250" y="373" class="pinlabel">gedeelde GND</text>

  <!-- VCC wire (external supply, dashed to indicate separate source) -->
  <line x1="660" y1="180" x2="750" y2="180" class="wire-pwr" stroke-dasharray="6,4"/>
  <text x="700" y="200" class="note">externe voeding</text>

  <!-- Debug UART adapter box -->
  <rect x="60" y="470" width="200" height="100" rx="8" class="box"/>
  <text x="75" y="495" class="label">CH340-adapter</text>
  <text x="75" y="515" class="pinlabel">(optioneel, voor debug-log)</text>
  <text x="75" y="535" class="pinlabel">115200 baud</text>

  <path d="M 60 240 L 260 240 L 260 480" class="wire" stroke-dasharray="4,3"/>
  <text x="265" y="360" class="pinlabel" fill="#1a6b1a">TX &#8594; RX</text>

  <path d="M 60 280 L 230 280 L 230 480" class="wire" stroke-dasharray="4,3"/>
  <text x="235" y="400" class="pinlabel" fill="#1a6b1a">RX &#8592; TX</text>

  <!-- Legend -->
  <rect x="700" y="420" width="180" height="150" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="712" y="440" class="label" font-size="13">Legenda</text>
  <line x1="712" y1="455" x2="740" y2="455" class="wire"/>
  <text x="748" y="459" class="pinlabel">Klok</text>
  <line x1="712" y1="475" x2="740" y2="475" class="wire-data"/>
  <text x="748" y="479" class="pinlabel">Data</text>
  <line x1="712" y1="495" x2="740" y2="495" class="wire-gnd"/>
  <text x="748" y="499" class="pinlabel">GND</text>
  <line x1="712" y1="515" x2="740" y2="515" class="wire-pwr"/>
  <text x="748" y="519" class="pinlabel">Voeding</text>
  <line x1="712" y1="535" x2="740" y2="535" class="wire" stroke-dasharray="4,3"/>
  <text x="748" y="539" class="pinlabel">Debug (optioneel)</text>
</svg>
